<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2D1F6E" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#080611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#E8A830" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#080611" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A830"/>
      <stop offset="100%" stop-color="#F07020"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8A830" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#E8A830" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#080611"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- top-left badge -->
  <g transform="translate(80, 70)">
    <rect width="240" height="44" rx="22" fill="#E8A830" fill-opacity="0.07" stroke="#E8A830" stroke-opacity="0.32"/>
    <circle cx="22" cy="22" r="5" fill="#E8A830"/>
    <text x="40" y="29" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#E8A830">NOW AVAILABLE · ANDROID</text>
  </g>

  <!-- top-right small wordmark -->
  <text x="1120" y="100" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#F5EDD8" letter-spacing="2">suraagmusic.in</text>

  <!-- main content -->
  <g transform="translate(80, 200)">
    <!-- logo mark -->
    <g>
      <rect width="120" height="120" rx="26" fill="#15112e" stroke="#E8A830" stroke-opacity="0.32" stroke-width="1.5"/>
      <g transform="translate(60, 60) scale(2.4) translate(-21, -21)">
        <rect x="3" y="17" width="4" height="8" rx="2" fill="#E8A830" opacity=".5"/>
        <rect x="9" y="12" width="4" height="18" rx="2" fill="#E8A830" opacity=".75"/>
        <rect x="15" y="7" width="4" height="28" rx="2" fill="#E8A830"/>
        <circle cx="23" cy="21" r="1.5" fill="#E8A830" opacity=".3"/>
        <circle cx="27" cy="21" r="1.5" fill="#E8A830" opacity=".5"/>
        <rect x="31" y="12" width="4" height="18" rx="2" fill="#F07020" opacity=".75"/>
        <rect x="37" y="17" width="4" height="8" rx="2" fill="#F07020" opacity=".5"/>
        <circle cx="25" cy="13" r="2.5" fill="#F5C96A" opacity=".7"/>
        <circle cx="25" cy="13" r="1.5" fill="#F5C96A"/>
      </g>
    </g>

    <!-- big wordmark -->
    <text x="0" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="148" font-weight="700" fill="#F5EDD8" letter-spacing="-3">Sur<tspan fill="#E8A830">aag</tspan></text>

    <!-- tagline -->
    <text x="0" y="290" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#E8A830" letter-spacing="6">MUSIC THAT NEVER LOSES YOU</text>

    <!-- description -->
    <text x="0" y="350" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#F5EDD8" opacity="0.8">Stream online. Play offline. Automatically.</text>
  </g>

  <!-- decorative waveform bottom-right -->
  <g transform="translate(720, 360)" opacity="0.55">
    <rect x="0"   y="60" width="6" height="40"  rx="3" fill="url(#waveGrad)"/>
    <rect x="14"  y="40" width="6" height="80"  rx="3" fill="url(#waveGrad)"/>
    <rect x="28"  y="20" width="6" height="120" rx="3" fill="url(#waveGrad)"/>
    <rect x="42"  y="0"  width="6" height="160" rx="3" fill="url(#waveGrad)"/>
    <rect x="56"  y="30" width="6" height="100" rx="3" fill="url(#waveGrad)"/>
    <rect x="70"  y="50" width="6" height="60"  rx="3" fill="url(#waveGrad)"/>
    <rect x="84"  y="10" width="6" height="140" rx="3" fill="url(#waveGrad)"/>
    <rect x="98"  y="35" width="6" height="90"  rx="3" fill="url(#waveGrad)"/>
    <rect x="112" y="55" width="6" height="50"  rx="3" fill="url(#waveGrad)"/>
    <rect x="126" y="25" width="6" height="110" rx="3" fill="url(#waveGrad)"/>
    <rect x="140" y="5"  width="6" height="150" rx="3" fill="url(#waveGrad)"/>
    <rect x="154" y="45" width="6" height="70"  rx="3" fill="url(#waveGrad)"/>
    <rect x="168" y="15" width="6" height="130" rx="3" fill="url(#waveGrad)"/>
    <rect x="182" y="50" width="6" height="60"  rx="3" fill="url(#waveGrad)"/>
    <rect x="196" y="30" width="6" height="100" rx="3" fill="url(#waveGrad)"/>
    <rect x="210" y="0"  width="6" height="160" rx="3" fill="url(#waveGrad)"/>
    <rect x="224" y="40" width="6" height="80"  rx="3" fill="url(#waveGrad)"/>
    <rect x="238" y="60" width="6" height="40"  rx="3" fill="url(#waveGrad)"/>
    <rect x="252" y="25" width="6" height="110" rx="3" fill="url(#waveGrad)"/>
    <rect x="266" y="50" width="6" height="60"  rx="3" fill="url(#waveGrad)"/>
    <rect x="280" y="15" width="6" height="130" rx="3" fill="url(#waveGrad)"/>
    <rect x="294" y="45" width="6" height="70"  rx="3" fill="url(#waveGrad)"/>
    <rect x="308" y="20" width="6" height="120" rx="3" fill="url(#waveGrad)"/>
    <rect x="322" y="55" width="6" height="50"  rx="3" fill="url(#waveGrad)"/>
    <rect x="336" y="35" width="6" height="90"  rx="3" fill="url(#waveGrad)"/>
    <rect x="350" y="10" width="6" height="140" rx="3" fill="url(#waveGrad)"/>
    <rect x="364" y="45" width="6" height="70"  rx="3" fill="url(#waveGrad)"/>
    <rect x="378" y="60" width="6" height="40"  rx="3" fill="url(#waveGrad)"/>
    <rect x="392" y="30" width="6" height="100" rx="3" fill="url(#waveGrad)"/>
    <rect x="406" y="5"  width="6" height="150" rx="3" fill="url(#waveGrad)"/>
    <rect x="420" y="40" width="6" height="80"  rx="3" fill="url(#waveGrad)"/>
    <rect x="434" y="55" width="6" height="50"  rx="3" fill="url(#waveGrad)"/>
  </g>

  <!-- bottom hairline -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#E8A830" stroke-opacity="0.18" stroke-width="0.5"/>

  <!-- bottom strip: feature pills -->
  <g transform="translate(80, 580)" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="2" fill="#F5EDD8" opacity="0.7">
    <text x="0" y="14">OFFLINE-FIRST</text>
    <text x="180" y="14">·</text>
    <text x="200" y="14">ZERO-MS SWITCH</text>
    <text x="380" y="14">·</text>
    <text x="400" y="14">FREE FOREVER</text>
    <text x="560" y="14">·</text>
    <text x="580" y="14">BUILT FOR INDIA</text>
  </g>
